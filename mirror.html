<!--
  Ported from the "AKOL Mirror" artifact (2026-08-17), with the pointer taken
  out on request: the artifact's idle drift — which was already its autonomous
  face — is now the only mode. The wordmark and the faces are the site's own
  files under /assets, not data URIs; licensing as per index and
  assets/fonts/NOTICE.md. The readout is European Teletext because it reads
  values (readout face, never chrome), on its native 16px.
-->
<style>
  @font-face{font-family:"European Teletext";src:url("/assets/fonts/european-teletext.ttf") format("truetype");font-display:block}

  :root{--black:#000; --field:#424242}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--black);overflow:hidden}
  .stage{position:relative;width:100vw;height:100vh}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;background:#000}
  .home{position:absolute;left:20px;top:18px}
  .home img{height:20px;width:auto;display:block}
  :focus-visible{outline:1px solid #fff;outline-offset:2px}
  .read{
    position:absolute;left:20px;bottom:18px;color:var(--field);
    font-family:"European Teletext",monospace;font-size:16px;
    letter-spacing:.08em;pointer-events:none;
  }
  noscript img.still{position:absolute;left:7%;top:50%;transform:translateY(-50%);width:86%}
</style>

<div class="stage">
  <canvas id="c" role="img" aria-label="The AKOL wordmark drawn coarsely pixelated, reflected in a mirror on either side."></canvas>
  <noscript><img class="still" src="/assets/img/akol-wordmark.png" alt="" width="1185" height="236"></noscript>
  <a class="home" href="/"><img src="/assets/img/akol-mark.png" alt="AKOL — home" width="240" height="48"></a>
  <div class="read" id="read">PIXEL · MIRROR</div>
</div>

<script>
/* AKOL drawn live, pixelated, with a mirror either side of the box it happens
 * in — the reflections are of the ANIMATED draw, recomputed every frame, not a
 * static image. The box breathes on its own: one slow sine coarsens the pixels,
 * another shifts the box. One offscreen buffer is rendered once per frame and
 * blitted: straight into the centre, flopped into the two flanks. */
const c=document.getElementById('c'), g=c.getContext('2d',{alpha:false});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
g.imageSmoothingEnabled=false;

const mark=new Image();
mark.src='/assets/img/akol-wordmark.png';

let W,H,boxW;
function resize(){
  const r=c.getBoundingClientRect(); W=r.width; H=r.height;
  c.width=W; c.height=H; g.imageSmoothingEnabled=false;
  boxW=W/3;                       // mirror | box | mirror, equal thirds
}
addEventListener('resize',resize); resize();

const ob=document.createElement('canvas'), og=ob.getContext('2d');

let t=0;
function frame(){
  t+=0.016;
  const px=0.35+0.25*(0.5+0.5*Math.sin(t*0.3));   // slow breath: coarseness
  const py=0.5+0.12*Math.sin(t*0.5);              // slow breath: box position

  // pixel cell breathes. box buffer is boxW/cell wide -> pixelation.
  const cell = 3 + Math.round(px*22);
  const bw = Math.max(2, Math.round(boxW/cell));
  const bh = Math.max(2, Math.round(H/cell));
  ob.width=bw; ob.height=bh; og.imageSmoothingEnabled=false;

  // --- draw AKOL into the low-res box buffer, alive ---
  og.fillStyle='#000'; og.fillRect(0,0,bw,bh);
  const sway = (py-0.5)*bh*0.6;
  const drift = Math.sin(t*0.7)*bw*0.02;
  // fit the wordmark across the box width, keep aspect
  const ar = mark.naturalWidth/mark.naturalHeight || 5;
  const dw = bw*0.86, dh = dw/ar;
  og.drawImage(mark, (bw-dw)/2 + drift, (bh-dh)/2 + sway, dw, dh);

  // --- composite: centre straight, two flanks flopped, all nearest-neighbour ---
  g.fillStyle='#000'; g.fillRect(0,0,W,H);
  g.drawImage(ob, boxW, 0, boxW, H);                 // the box
  g.save(); g.translate(boxW,0); g.scale(-1,1);
  g.drawImage(ob, 0, 0, boxW, H); g.restore();       // left mirror
  g.save(); g.translate(3*boxW,0); g.scale(-1,1);
  g.drawImage(ob, 0, 0, boxW, H); g.restore();       // right mirror

  // seams between box and mirrors, faint
  g.strokeStyle='#242424'; g.lineWidth=1;
  g.beginPath(); g.moveTo(boxW+.5,0); g.lineTo(boxW+.5,H);
  g.moveTo(2*boxW+.5,0); g.lineTo(2*boxW+.5,H); g.stroke();

  document.getElementById('read').textContent = `PIXEL ${cell}px · MIRROR x2`;
  if(!reduced) requestAnimationFrame(frame);
}
function start(){ if(reduced) frame(); else requestAnimationFrame(frame); }
if(mark.complete) start(); else mark.onload=start;
</script>
</html>
