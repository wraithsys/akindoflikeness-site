[package]
name = "phyllotaxis-live"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Chat-to-instrument relay for the streaming rig: fishes shared patches out of a stream chat and re-serves the current one on loopback for the ?live page to poll."

[dependencies]
clap = { version = "4", features = ["derive"] }
# Pure-rust TLS for the Twitch IRC connection: no system OpenSSL to install,
# and `ring` instead of the default aws-lc provider, which wants cmake.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
