[package]
name = "phyllotaxis-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The C-ABI boundary the AudioWorklet calls. No bindgen, no allocation on the audio path."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
phyllotaxis-tuning = { path = "../phyllotaxis-tuning" }
phyllotaxis-voice = { path = "../phyllotaxis-voice" }
phyllotaxis-field = { path = "../phyllotaxis-field" }
phyllotaxis-pool = { path = "../phyllotaxis-pool" }
phyllotaxis-fx = { path = "../phyllotaxis-fx" }
phyllotaxis-cadence = { path = "../phyllotaxis-cadence" }
